<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title and page.title != site.title %}
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
{%- else %}
<title>{{ site.title | escape }}</title>
{%- endif %}
{%- assign meta_description = page.description | default: site.description %}
{%- if meta_description %}
<meta name="description" content="{{ meta_description | strip_html | strip_newlines | escape }}">
{%- endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/ostera.css' | relative_url }}">
<script src="{{ '/assets/js/ostera.js' | relative_url }}" defer></script>
